<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Letter T -->
  <text x="20" y="95" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="84" fill="white">T</text>
  <!-- Flow arrow -->
  <text x="88" y="85" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="white">></text>

  <!-- Three flowing dots -->
  <circle cx="68" cy="55" r="4" fill="#A78BFA"/>
  <circle cx="76" cy="51" r="3.5" fill="#C4B5FD"/>
  <circle cx="83" cy="48" r="3" fill="#DDD6FE"/>
  <circle cx="68" cy="83" r="4" fill="#A78BFA"/>
  <circle cx="76" cy="87" r="3.5" fill="#C4B5FD"/>
  <circle cx="83" cy="90" r="3" fill="#DDD6FE"/>
</svg>
